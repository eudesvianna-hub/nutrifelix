<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri Félix - Conheça a História</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 850px;
            border: 4px solid #4CAF50;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: clamp(1.2rem, 2.2vw, 1.7rem);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .content-layout {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .content-layout {
                flex-direction: row;
                align-items: center; /* Centraliza verticalmente ao lado da doutora */
            }
        }

        /* Seção da Doutora e Aviso */
        .sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .construction-text {
            font-weight: bold;
            color: #d9534f;
            font-size: 0.9rem;
            line-height: 1.4;
            max-width: 140px;
            text-transform: uppercase;
        }

        .doctor-img {
            width: 90px;
            height: auto;
            object-fit: contain;
        }

        /* Quadro único para a foto horizontal da Nutri */
        .single-photo-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .photo-card {
            background: #fff;
            border: 3px solid #4CAF50;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px; /* Controla o tamanho máximo ideal para a foto horizontal */
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Nessa página você terá acesso a benefícios exclusivos!</h1>
        
        <div class="content-layout">
            <div class="sidebar">
                <div class="construction-text">
                    Página em construção.<br>Aguarde
                </div>
                <img src="473623.png" alt="Doutora" class="doctor-img">
            </div>

            <div class="single-photo-container">
                <div class="photo-card">
                    <img src="nutricci.jpg" alt="Fit Nutricci">
                </div>
            </div>
        </div>
    </div>

</body>
</html>
