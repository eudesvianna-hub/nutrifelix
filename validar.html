<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri Félix - Validar Cardápio</title>
  
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  
  <!-- Gerador de PDF no Navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
    
    header { width: 100%; max-width: 900px; background: #fff8e7; border: 1px solid #707070; border-radius: 4px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .logo-img { width: 55px; height: 55px; object-fit: contain; }
    .menu-btn { background-color: #5551f1; color: white; border: none; width: 42px; height: 42px; border-radius: 8px; font-size: 20px; cursor: pointer; }
    
    .main-layout { display: flex; gap: 20px; max-width: 900px; width: 100%; }
    .card-left { background: white; border: 1px solid #c8c8c8; border-radius: 12px; width: 200px; padding: 12px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .card-img-wrapper { width: 100%; height: 220px; border: 1.5px solid #8183f0; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 14px; font-weight: 700; text-align: center; }
    
    .validation-box { flex: 1; background: white; border: 1px solid #b5b5b5; border-radius: 8px; padding: 24px; min-height: 280px; }
    .search-form { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-code { flex: 1; padding: 10px 14px; border: 1px solid #707070; border-radius: 4px; font-size: 14px; }
    .btn-submit { background-color: #5551f1; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    
    .status-container { margin-top: 15px; font-size: 14px; }
    .result-card { border-radius: 8px; padding: 20px; margin-top: 10px; }
    .result-success { background-color: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; text-align: center; }
    .result-error { background-color: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }
    
    .btn-download-pdf { margin-top: 16px; background-color: #2e7d32; color: #ffffff; border: none; padding: 12px 24px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .btn-download-pdf:hover { background-color: #1b5e20; }

    /* Layout Interno Oculto para Renderização do PDF */
    #pdf-wrapper { display: none; }
    .pdf-container { width: 210mm; background: #ffffff; padding: 18mm 15mm; color: #2d3748; font-size: 10.5pt; line-height: 1.4; }
    .pdf-header { text-align: center; border-bottom: 2px solid #2e7d32; padding-bottom: 10px; margin-bottom: 14px; }
    .pdf-header h1 { color: #2e7d32; font-size: 15pt; text-transform: uppercase; letter-spacing: 0.5px; }
    .pdf-header p { font-size: 10.5pt; color: #4a5568; margin-top: 2px; }
    
    .meal-card { margin-bottom: 10px; padding: 8px 12px; background: #f8fafc; border-left: 4px solid #2e7d32; border-radius: 0 4px 4px 0; }
    .meal-type { font-size: 10pt; font-weight: bold; color: #2e7d32; text-transform: uppercase; margin-bottom: 2px; }
    .meal-prato { font-weight: bold; color: #1a202c; font-size: 10.5pt; }
    .meal-info { margin-top: 3px; font-size: 9.5pt; color: #4a5568; }
    
    .pdf-footer { margin-top: 15px; border-top: 1px solid #e2e8f0; padding-top: 10px; font-size: 9pt; color: #4a5568; }
    .nutri-sig { margin-top: 12px; text-align: right; }
    .nutri-name { font-weight: bold; color: #2e7d32; font-size: 10pt; }
  </style>
</head>
<body>

  <header>
    <a href="index.html"><img src="nutriLogo.png" class="logo-img" alt="Nutri Félix"></a>
    <button class="menu-btn">&#9776;</button>
  </header>

  <main class="main-layout">
    <div class="card-left">
      <div class="card-img-wrapper"><img src="1785022150778(1)(1).png" class="card-img" alt="App Preview"></div>
      <span class="card-title">Meu App</span>
    </div>

    <div class="validation-box">
      <form id="validateForm" class="search-form">
        <input type="text" id="codigoInput" class="input-code" placeholder="Digite aqui o código do seu cardápio" required>
        <button type="submit" class="btn-submit">Validar</button>
      </form>
      <div id="statusContainer" class="status-container"></div>
    </div>
  </main>

  <!-- Container oculta onde o PDF é estruturado em background para download -->
  <div id="pdf-wrapper">
    <div id="pdfContent" class="pdf-container">
      <div class="pdf-header">
        <h1>Plano Alimentar Personalizado</h1>
        <p><strong id="pdfPaciente">Paciente: Validade do Sistema</strong></p>
        <p style="font-size: 9pt; color: #718096; margin-top: 4px;">Nutri Master | Nutri Félix</p>
      </div>

      <div id="pdfMealsList"></div>

      <div class="pdf-footer">
        <p><strong>VALOR ENERGÉTICO TOTAL:</strong> <span id="pdfCalorias">1350</span> kcal</p>
        <p style="margin-top: 4px;" id="pdfAlertas"></p>
        
        <div class="nutri-sig">
          <p class="nutri-name">Christina Félix da Silva</p>
          <p>Nutricionista — CRN3-73810 Fito 0640</p>
          <p style="font-size: 8pt; color: #a0aec0; margin-top: 2px;">Ref. Cardápio: <span id="pdfDocId"></span></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQseJ1WXMOo-6HbSZ8euZGstspNABorA4",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "antares-7ebcb",
      storageBucket: "antares-7ebcb.firebasestorage.app",
      messagingSenderId: "663101896650",
      appId: "1:663101896650:web:7b23ff22cfd97a371b4133"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('validateForm');
    const input = document.getElementById('codigoInput');
    const statusContainer = document.getElementById('statusContainer');

    let rawCardapioData = null;
    let currentDocId = '';

    async function validarCardapio(docId) {
      if (!docId) return;
      currentDocId = docId.trim();

      statusContainer.innerHTML = '<p>Validando cardápio no sistema...</p>';

      try {
        const docRef = db.collection('CardapioIA').doc(currentDocId);
        const docSnap = await docRef.get();

        if (docSnap.exists) {
          const data = docSnap.data();
          
          // Trata campo Cardapio (se vier como String JSON ou Objeto)
          if (typeof data.Cardapio === 'string') {
            try { rawCardapioData = JSON.parse(data.Cardapio); } catch (e) { rawCardapioData = {}; }
          } else {
            rawCardapioData = data.Cardapio || {};
          }

          let dataStr = '';
          if (data.dataCardapio) {
            const dt = data.dataCardapio.toDate ? data.dataCardapio.toDate() : new Date(data.dataCardapio.seconds * 1000);
            dataStr = dt.toLocaleDateString('pt-BR');
          }

          montarPDFTemplate(rawCardapioData, currentDocId);

          statusContainer.innerHTML = `
            <div class="result-card result-success">
              <h3 style="margin-bottom: 8px;">✓ Cardápio Válido e Autêntico!</h3>
              <p><strong>ID:</strong> ${currentDocId}</p>
              ${dataStr ? `<p><strong>Emitido em:</strong> ${dataStr}</p>` : ''}
              <button class="btn-download-pdf" onclick="baixarPDF()">
                📄 Baixar Cardápio em PDF
              </button>
            </div>
          `;

        } else {
          statusContainer.innerHTML = `
            <div class="result-card result-error">
              <h3>Cardápio não localizado</h3>
              <p>O ID "<strong>${docId}</strong>" não consta em nosso sistema.</p>
            </div>
          `;
        }
      } catch (error) {
        console.error("Erro no Firestore:", error);
        statusContainer.innerHTML = `
          <div class="result-card result-error">
            <h3>Erro na Validação</h3>
            <p>Não foi possível conectar ao banco de dados.</p>
          </div>
        `;
      }
    }

    function montarPDFTemplate(cardapio, docId) {
      document.getElementById('pdfDocId').innerText = docId;
      document.getElementById('pdfCalorias').innerText = cardapio.calorias || '1350';
      document.getElementById('pdfAlertas').innerText = cardapio.alerta_medico || cardapio.observacoes || 'Sua dedicação é o melhor ingrediente para uma vida com mais saúde e vitalidade.';

      const mealsContainer = document.getElementById('pdfMealsList');
      mealsContainer.innerHTML = '';

      const refeicoesChaves = [
        { key: 'cafe_manha', label: 'CAFÉ DA MANHÃ' },
        { key: 'lanche_manha', label: 'LANCHE DA MANHÃ' },
        { key: 'almoco', label: 'ALMOÇO' },
        { key: 'lanche_tarde', label: 'LANCHE DA TARDE' },
        { key: 'jantar', label: 'JANTAR' }
      ];

      refeicoesChaves.forEach(ref => {
        if (cardapio[ref.key]) {
          const item = cardapio[ref.key];
          const prato = item.prato || 'Refeição Personalizada';
          const preparo = item.preparo ? `<div><strong>Preparo:</strong> ${item.preparo}</div>` : '';
          const subst = item.substituicoes ? `<div><strong>Substituições:</strong> ${item.substituicoes}</div>` : '';

          const block = document.createElement('div');
          block.className = 'meal-card';
          block.innerHTML = `
            <div class="meal-type">${ref.label}</div>
            <div class="meal-prato">${prato}</div>
            <div class="meal-info">${preparo}${subst}</div>
          `;
          mealsContainer.appendChild(block);
        }
      });
    }

    function baixarPDF() {
      const element = document.getElementById('pdfContent');
      const wrapper = document.getElementById('pdf-wrapper');

      wrapper.style.display = 'block';

      const opt = {
        margin:       10,
        filename:     `Cardapio_NutriFelix_${currentDocId}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        wrapper.style.display = 'none';
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      const search = window.location.search;
      if (search) {
        const codigoParam = decodeURIComponent(search.substring(1).replace('codigo=', ''));
        if (codigoParam) {
          input.value = codigoParam;
          validarCardapio(codigoParam);
        }
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      validarCardapio(input.value);
    });
  </script>
</body>
</html>
