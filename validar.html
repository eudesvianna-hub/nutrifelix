<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri Félix - Validar Cardápio</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
    header { width: 100%; max-width: 900px; background: #fff8e7; border: 1px solid #707070; border-radius: 4px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .logo-img { width: 55px; height: 55px; object-fit: contain; }
    .menu-btn { background-color: #5551f1; color: white; border: none; width: 42px; height: 42px; border-radius: 8px; font-size: 20px; cursor: pointer; }
    .main-layout { display: flex; gap: 20px; max-width: 900px; width: 100%; flex-wrap: wrap; }
    .card-left { background: white; border: 1px solid #c8c8c8; border-radius: 12px; width: 200px; padding: 12px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .card-img-wrapper { width: 100%; height: 220px; border: 1.5px solid #8183f0; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 14px; font-weight: 700; text-align: center; }
    .validation-box { flex: 1; background: white; border: 1px solid #b5b5b5; border-radius: 8px; padding: 24px; min-height: 280px; min-width: 280px; }
    .search-form { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-code { flex: 1; padding: 10px 14px; border: 1px solid #707070; border-radius: 4px; font-size: 14px; }
    .btn-submit { background-color: #5551f1; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .status-container { margin-top: 15px; font-size: 14px; }
    .result-card { border-radius: 6px; padding: 16px; margin-top: 10px; }
    .result-success { background-color: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
    .result-error { background-color: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }
    
    .btn-download-pdf {
      margin-top: 15px;
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }
    .btn-download-pdf:hover { background-color: #1b5e20; }

    /* ESTILOS DO PDF OCULTO */
    #pdf-container-wrapper {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }

    .pdf-page {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #333333;
      box-sizing: border-box;
    }

    .pdf-banner {
      background-color: #1a5d57;
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-banner-info h1 {
      font-size: 15pt;
      font-weight: bold;
      margin-top: 4px;
    }

    .pdf-banner-logo {
      height: 50px;
      object-fit: contain;
      background: white;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .pdf-dates {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 9pt;
      color: #166534;
      display: flex;
      justify-content: space-between;
    }

    .pdf-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      page-break-inside: avoid;
    }

    .pdf-card-header {
      color: #1a5d57;
      font-size: 9pt;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .pdf-card-title {
      font-size: 11pt;
      font-weight: bold;
      color: #1a202c;
      margin-bottom: 6px;
    }

    .pdf-card-body {
      font-size: 9.5pt;
      line-height: 1.4;
      color: #4a5568;
    }

    .pdf-badge {
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 8.5pt;
      margin-top: 6px;
    }

    .pdf-badge-subst { background-color: #fefcbf; color: #744210; }
    .pdf-badge-benefit { background-color: #edf2f7; color: #2d3748; }

    .pdf-footer {
      margin-top: 30px;
      border-top: 1px solid #e2e8f0;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      page-break-inside: avoid;
    }
  </style>

  <!-- SDKs Firebase Compat e Bibliotecas do PDF -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <header>
    <a href="index.html"><img src="nutriLogo.png" class="logo-img" alt="Nutri Logo"></a>
    <button class="menu-btn">&#9776;</button>
  </header>

  <main class="main-layout">
    <div class="card-left">
      <div class="card-img-wrapper"><img src="1785022150778(1)(1).png" class="card-img" alt="Meu App"></div>
      <span class="card-title">Meu App</span>
    </div>

    <div class="validation-box">
      <form id="validateForm" class="search-form">
        <input type="text" id="codigoInput" class="input-code" placeholder="Digite aqui o código do seu cardápio" required>
        <button type="submit" class="btn-submit">Validar</button>
      </form>
      <div id="statusContainer" class="status-container"></div>
    </div>
  </main>

  <!-- Estrutura Renderizada Oculta do PDF -->
 <div id="pdf-container-wrapper" style="position: absolute; left: -9999px; top: -9999px;">
  <div id="pdf-content" class="pdf-page"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDQseJ1WXMOo-6HbSZ8euZGstspNABorA4",
    authDomain: "seu-projeto.firebaseapp.com",
    projectId: "antares-7ebcb",
    storageBucket: "antares-7ebcb.firebasestorage.app",
    messagingSenderId: "663101896650",
    appId: "1:663101896650:web:7b23ff22cfd97a371b4133"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const form = document.getElementById('validateForm');
  const input = document.getElementById('codigoInput');
  const statusContainer = document.getElementById('statusContainer');

  let globalNomePaciente = 'Não informado';
  let globalDataCriacao = 'Não informada';

  async function validarCardapio(docId) {
    if (!docId) return;

    statusContainer.innerHTML = '<p class="loading-spinner">Validando cardápio no sistema...</p>';

    try {
      const docRef = db.collection('CardapioIA').doc(docId.trim());
      const docSnap = await docRef.get();

      if (docSnap.exists) {
        const data = docSnap.data();

        // 1. Trata a Data (do seu script original)
        if (data.dataCardapio) {
          const dataValida = data.dataCardapio.toDate ? data.dataCardapio.toDate() : new Date(data.dataCardapio.seconds * 1000);
          globalDataCriacao = dataValida.toLocaleDateString('pt-BR');
        } else {
          globalDataCriacao = new Date().toLocaleDateString('pt-BR');
        }

        // 2. Busca o nome do usuário/paciente na coleção users (se houver userID)
        let rawUid = data.userID || data.user_id || data.userId || data.uid;
        if (rawUid) {
          let uid = (typeof rawUid === 'object' && rawUid.id) ? rawUid.id : (typeof rawUid === 'string' && rawUid.includes('/') ? rawUid.split('/').pop() : rawUid);
          try {
            const userSnap = await db.collection('users').doc(uid).get();
            if (userSnap.exists) {
              const uData = userSnap.data();
              globalNomePaciente = uData.display_name || uData.nome || uData.name || 'Não informado';
            }
          } catch (e) {
            console.error("Erro ao carregar usuário:", e);
          }
        }

        // 3. Monta e insere o HTML da validação na tela (Lógica idêntica à sua)
        let html = '<div class="result-card result-success">';
        html += '<div class="result-title"> Cardápio Válido e Autêntico!</div>';
        html += `<p><strong>ID do Cardápio:</strong> ${docSnap.id}</p>`;
        html += `<p><strong>Paciente:</strong> ${globalNomePaciente}</p>`;
        html += `<p><strong>Data:</strong> ${globalDataCriacao}</p>`;

        if (data.Cardapio) {
          // Processa o conteúdo do cardápio para montar a visualização no PDF oculto
          montarPDF(data.Cardapio, docSnap.id, globalNomePaciente, globalDataCriacao);
          
          html += `<button class="btn-download-pdf" onclick="baixarPDF()" style="margin-top:15px; padding:10px 18px; background-color:#2e7d32; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">📄 Baixar Cardápio em PDF</button>`;
        }

        html += '</div>';
        statusContainer.innerHTML = html;

      } else {
        statusContainer.innerHTML = `
          <div class="result-card result-error">
            <div class="result-title"> Cardápio não localizado</div>
            <p>O ID "<strong>${docId}</strong>" não consta em nosso sistema.</p>
          </div>
        `;
      }
    } catch (error) {
      console.error("Erro ao buscar documento no Firestore:", error);
      statusContainer.innerHTML = `
        <div class="result-card result-error">
          <div class="result-title">Erro na Validação</div>
          <p>Não foi possível conectar ao banco de dados. Verifique sua conexão e credenciais.</p>
        </div>
      `;
    }
  }

  // Função Universal para formatar o corpo do PDF sem perdas
  function montarPDF(rawCardapio, docId, paciente, dataCriacao) {
    const pdfContainer = document.getElementById('pdf-content');
    const dataHoje = new Date().toLocaleDateString('pt-BR');
    let conteudoHtml = '';

    let parsed = rawCardapio;
    if (typeof rawCardapio === 'string') {
      try {
        parsed = JSON.parse(rawCardapio);
      } catch (e) {
        parsed = rawCardapio; // Mantém como texto puro caso não seja um JSON
      }
    }

    // Se for um Objeto/JSON formatado
    if (typeof parsed === 'object' && parsed !== null) {
      Object.keys(parsed).forEach(key => {
        const item = parsed[key];
        const titulo = key.replace(/_/g, ' ').toUpperCase();

        if (typeof item === 'object' && item !== null) {
          conteudoHtml += `
            <div class="pdf-card" style="border:1px solid #e2e8f0; border-radius:6px; padding:12px; margin-bottom:10px;">
              <div style="color:#1a5d57; font-weight:bold; font-size:10pt;">${titulo}</div>
              <div style="font-weight:bold; font-size:11pt; margin:4px 0;">${item.prato || item.nome || ''}</div>
              <div style="font-size:9.5pt; color:#4a5568;">${item.preparo || item.descricao || ''}</div>
              ${item.topping ? `<div style="background:#f0fdf4; color:#166534; padding:4px 8px; font-size:8.5pt; margin-top:4px; border-radius:4px;"><strong>Dica:</strong> ${item.topping}</div>` : ''}
              ${item.substituicoes ? `<div style="background:#fefcbf; color:#744210; padding:4px 8px; font-size:8.5pt; margin-top:4px; border-radius:4px;"><strong>Substituições:</strong> ${item.substituicoes}</div>` : ''}
            </div>
          `;
        } else {
          conteudoHtml += `
            <div class="pdf-card" style="border:1px solid #e2e8f0; border-radius:6px; padding:12px; margin-bottom:10px;">
              <div style="color:#1a5d57; font-weight:bold; font-size:10pt;">${titulo}</div>
              <div style="font-size:9.5pt; color:#4a5568;">${item}</div>
            </div>
          `;
        }
      });
    } else {
      // Se for Texto Simples (String sem formato JSON)
      conteudoHtml = `<div style="white-space: pre-wrap; font-size: 10pt; line-height: 1.5; color: #333;">${parsed}</div>`;
    }

    const urlValidacao = `https://nutrifelix.com.br/validar.html?id=${docId}`;

    pdfContainer.innerHTML = `
      <div class="pdf-banner" style="background:#1a5d57; color:white; padding:16px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <div>
          <span style="font-size:8pt; text-transform:uppercase; letter-spacing:1px; opacity:0.8;">Plano Alimentar Autêntico</span>
          <h1 style="font-size:14pt; margin-top:2px;">PACIENTE: ${paciente.toUpperCase()}</h1>
        </div>
        <img src="nutriLogo.png" style="height:45px; background:white; padding:4px; border-radius:4px;" alt="Logo">
      </div>

      <div style="background:#f0fdf4; border:1px solid #bbf7d0; padding:8px 12px; border-radius:6px; margin-bottom:15px; font-size:8.5pt; color:#166534; display:flex; justify-content:space-between;">
        <div><strong>Data do Cardápio:</strong> ${dataCriacao}</div>
        <div><strong>Emissão do PDF:</strong> ${dataHoje}</div>
        <div><strong>ID:</strong> ${docId}</div>
      </div>

      <div>${conteudoHtml}</div>

      <div style="margin-top:25px; border-top:1px solid #e2e8f0; padding-top:12px; display:flex; justify-content:space-between; align-items:center;">
        <div id="qrcode-pdf"></div>
        <div style="font-size:8.5pt; color:#4a5568; text-align:right;">
          <div style="font-weight:bold; color:#1a5d57;">Christina Félix da Silva</div>
          <div>Nutricionista — CRN3-73810 Fito 0640</div>
          <div style="font-size:7.5pt; color:#718096;">nutrifelix.com.br</div>
        </div>
      </div>
    `;

    setTimeout(() => {
      const qrContainer = document.getElementById('qrcode-pdf');
      if (qrContainer) {
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: urlValidacao,
          width: 55,
          height: 55,
          colorDark: "#1a5d57",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }, 100);
  }

  function baixarPDF() {
    const element = document.getElementById('pdf-content');
    const opt = {
      margin:       10,
      filename:     `Cardapio_${globalNomePaciente.replace(/\s+/g, '_')}.pdf`,
      image:        { type: 'jpeg', quality: 0.98 },
      html2canvas:  { scale: 2, useCORS: true },
      jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
  }

  // Leitura da URL ao carregar a página
  window.addEventListener('DOMContentLoaded', () => {
    const search = window.location.search;
    if (search) {
      const urlParams = new URLSearchParams(search);
      let codigoParam = urlParams.get('id') || urlParams.get('codigo');

      if (!codigoParam && search.length > 1) {
        codigoParam = decodeURIComponent(search.substring(1));
      }

      if (codigoParam) {
        input.value = codigoParam.trim();
        validarCardapio(codigoParam.trim());
      }
    }
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    validarCardapio(input.value.trim());
  });
</script>
</body>
</html>
