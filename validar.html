<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri Félix - Validar Cardápio</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0fdf4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    header {
      width: 100%;
      max-width: 900px;
      background: #fff6e7;
      border: 1px solid #f07870;
      border-radius: 4px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo-img {
      height: 45px;
      object-fit: contain;
    }

    .menu-btn {
      background-color: #a556f1;
      color: white;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
    }

    .main-layout {
      display: flex;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      flex-wrap: wrap;
    }

    .card-left {
      background: white;
      border: 1px solid #dcdcdc;
      border-radius: 12px;
      padding: 12px;
      width: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .card-img-wrapper {
      width: 100%;
      height: 220px;
      border: 1.5px solid #8183fb;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
    }

    .validation-box {
      flex: 1;
      background: white;
      border: 1px solid #b5b5b5;
      border-radius: 8px;
      padding: 24px;
      min-width: 280px;
    }

    .search-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-code {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #707070;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn-submit {
      background-color: #a556f1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #8e3ee0;
    }

    .result-card {
      padding: 15px;
      border-radius: 6px;
    }

    .result-success {
      background-color: #eaf8e9;
      border: 1px solid #a8e0a7;
      color: #1b5e20;
    }

    .result-error {
      background-color: #ffffee;
      border: 1px solid #ef9a9a;
      color: #c62828;
    }

    .btn-download-pdf {
      margin-top: 15px;
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-block;
    }

    .btn-download-pdf:hover {
      background-color: #1b5e20;
    }

    /* ESTILOS DO PDF OCULTO */
    #pdf-container-wrapper {
      position: absolute;
      left: -9999px;
      top: -9999px;
    }

    .pdf-page {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #333333;
      box-sizing: border-box;
    }

    .pdf-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #1a5d57;
      padding-bottom: 10px;
    }

    .pdf-logo {
      height: 50px;
      object-fit: contain;
    }

    .pdf-banner {
      background-color: #1a5d57;
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .pdf-banner h1 {
      font-size: 16pt;
      letter-spacing: 0.5px;
      font-weight: bold;
      margin-top: 4px;
    }

    .pdf-patient {
      font-size: 11pt;
      opacity: 0.95;
      margin-top: 4px;
    }

    .pdf-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      page-break-inside: avoid;
    }

    .pdf-card-header {
      color: #1a5d57;
      font-size: 9pt;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .pdf-card-title {
      font-size: 11pt;
      font-weight: bold;
      color: #1a202c;
      margin-bottom: 8px;
    }

    .pdf-card-body {
      font-size: 9.5pt;
      line-height: 1.4;
      color: #4a5568;
    }

    .pdf-badge {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 9pt;
      margin-top: 8px;
      line-height: 1.3;
    }

    .pdf-badge-topping {
      color: #1a5d57;
      font-weight: 500;
    }

    .pdf-badge-subst {
      background-color: #fefcbf;
      color: #744210;
    }

    .pdf-badge-benefit {
      background-color: #edf2f7;
      color: #2d3748;
    }

    .pdf-footer {
      margin-top: 30px;
      border-top: 1px solid #e2e8f0;
      padding-top: 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      page-break-inside: avoid;
    }

    .pdf-nutri-info {
      font-size: 8.5pt;
      color: #4a5568;
      line-height: 1.4;
    }

    .pdf-nutri-name {
      color: #1a5d57;
      font-weight: bold;
      font-size: 10pt;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://nutrifelix.com.br/nutriLogo.png" alt="Nutri Félix" class="logo-img" onerror="this.src='nutriLogo.png'">
    <button class="menu-btn">☰</button>
  </header>

  <div class="main-layout">
    <div class="card-left">
      <div class="card-img-wrapper">
        <img src="https://nutrifelix.com.br/nutricci.png" alt="Meu App" class="card-img" onerror="this.src='nutricci.png'">
      </div>
      <div class="card-title">Meu App</div>
    </div>

    <div class="validation-box">
      <div class="search-form">
        <input type="text" id="inputDocId" class="input-code" placeholder="Cole aqui o ID do Cardápio...">
        <button class="btn-submit" onclick="onClickValidar()">Validar</button>
      </div>

      <div id="statusContainer"></div>
    </div>
  </div>

  <div id="pdf-container-wrapper">
    <div id="pdf-content" class="pdf-page"></div>
  </div>

  <script>
    // 1. Configuração do Firebase
    // ATENÇÃO: Substitua 'SUA_API_KEY_REAL_AQUI' pela apiKey encontrada no Console do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyDQseJ1WXMOo-6HbSZ8euZGstspNABorA4", 
      authDomain: "antares-7ebcb.firebaseapp.com",
      projectId: "antares-7ebcb",
      storageBucket: "antares-7ebcb.appspot.com",
      messagingSenderId: "663101896650",
      appId: "1:663101896650:web:7b23ff22cfd97a371b4133"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let currentDocId = '';
    let currentNomePaciente = 'Não informado';

    // 2. Leitura da URL ao carregar
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const docId = urlParams.get('id');

      if (docId) {
        document.getElementById('inputDocId').value = docId;
        validarCardapio(docId);
      }
    });

    function onClickValidar() {
      const id = document.getElementById('inputDocId').value.trim();
      if (id) {
        validarCardapio(id);
      }
    }

    // 3. Função Principal de Consulta no Firestore
    async function validarCardapio(docId) {
      if (!docId) return;
      currentDocId = docId.trim();

      const statusContainer = document.getElementById('statusContainer');
      statusContainer.innerHTML = '<p>Validando cardápio no sistema...</p>';

      try {
        // Consulta o documento na coleção CardapioIA
        const docSnap = await db.collection('CardapioIA').doc(currentDocId).get();

        if (docSnap.exists) {
          const data = docSnap.data();
          console.log("=== CardapioIA Encontrado ===", data);

          let cardapioObj = {};
          let nomePaciente = 'Não informado';

          // Extrai a referência do campo 'userID'
          let rawUid = data.userID || data.user_id || data.userId || data.uid || data.user;
          let uid = '';

          if (rawUid) {
            if (typeof rawUid === 'object' && rawUid.id) {
              uid = rawUid.id; // Se for um DocumentReference do Firestore
            } else if (typeof rawUid === 'string') {
              uid = rawUid.includes('/') ? rawUid.split('/').pop() : rawUid; // Se for string '/users/UID'
            }
          }

          console.log("UID extraído:", uid);

          // Busca o nome na coleção 'users'
          if (uid) {
            try {
              const userSnap = await db.collection('users').doc(uid).get();
              if (userSnap.exists) {
                const userData = userSnap.data();
                console.log("=== Dados do Usuário ===", userData);
                nomePaciente = userData.display_name || userData.nome || userData.name || 'Não informado';
              } else {
                console.warn(`Documento ${uid} não encontrado na coleção 'users'.`);
              }
            } catch (errUser) {
              console.error("Erro ao ler coleção 'users':", errUser);
            }
          }

          currentNomePaciente = nomePaciente;

          // Faz o parse do JSON do cardápio se necessário
          if (typeof data.Cardapio === 'string') {
            try { 
              cardapioObj = JSON.parse(data.Cardapio); 
            } catch (e) { 
              console.error("Erro no JSON.parse:", e);
              cardapioObj = {}; 
            }
          } else if (typeof data.Cardapio === 'object' && data.Cardapio !== null) {
            cardapioObj = data.Cardapio;
          }

          // Monta o layout do PDF com os dados
          montarPDFTemplate(cardapioObj, currentDocId, currentNomePaciente);

          statusContainer.innerHTML = `
            <div class="result-card result-success">
              <h3 style="margin-bottom: 8px;">✓ Cardápio Válido e Autêntico!</h3>
              <p><strong>Paciente:</strong> ${currentNomePaciente}</p>
              <p><strong>ID do Cardápio:</strong> ${currentDocId}</p>
              <button class="btn-download-pdf" onclick="baixarPDF()">
                📄 Baixar Cardápio em PDF
              </button>
            </div>
          `;

        } else {
          statusContainer.innerHTML = `
            <div class="result-card result-error">
              <h3>Cardápio não localizado</h3>
              <p>O ID "<strong>${docId}</strong>" não consta em nosso banco de dados.</p>
            </div>
          `;
        }
      } catch (error) {
        console.error("Erro geral na validação:", error);
        statusContainer.innerHTML = `
          <div class="result-card result-error">
            <h3>Erro na Validação</h3>
            <p>Não foi possível conectar ao banco de dados. Verifique a API Key do Firebase.</p>
          </div>
        `;
      }
    }

    // 4. Montagem do PDF
    function montarPDFTemplate(cardapio, docId, nomePaciente) {
      const pdfContainer = document.getElementById('pdf-content');

      const refeicoesChaves = [
        { key: 'cafe_manha', titulo: 'Café da Manhã' },
        { key: 'lanche_manha', titulo: 'Lanche da Manhã' },
        { key: 'almoco', titulo: 'Almoço' },
        { key: 'lanche_tarde', titulo: 'Lanche da Tarde' },
        { key: 'jantar', titulo: 'Jantar' },
        { key: 'ceia', titulo: 'Ceia' }
      ];

      let refeicoesHtml = '';

      refeicoesChaves.forEach(ref => {
        const item = cardapio[ref.key];
        if (item) {
          refeicoesHtml += `
            <div class="pdf-card">
              <div class="pdf-card-header">${ref.titulo}</div>
              <div class="pdf-card-title">${item.prato || ''}</div>
              <div class="pdf-card-body"><strong>Preparo:</strong> ${item.preparo || ''}</div>
              
              ${item.topping ? `<div class="pdf-badge pdf-badge-topping"><strong>Topping / Dica:</strong> ${item.topping}</div>` : ''}
              ${item.substituicoes ? `<div class="pdf-badge pdf-badge-subst"><strong>Substituições:</strong> ${item.substituicoes}</div>` : ''}
              ${item.motivo ? `<div class="pdf-badge pdf-badge-benefit"><strong>Benefício:</strong> ${item.motivo}</div>` : ''}
            </div>
          `;
        }
      });

      const urlValidacao = `https://nutrifelix.com.br/validar.html?id=${docId}`;

      pdfContainer.innerHTML = `
        <div class="pdf-header-top">
          <img src="https://nutrifelix.com.br/nutriLogo.png" alt="Nutri Félix Logo" class="pdf-logo" onerror="this.src='nutriLogo.png'">
        </div>

        <div class="pdf-banner">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span style="background-color: rgba(255, 255, 255, 0.25); color: #ffffff; padding: 3px 8px; border-radius: 4px; font-size: 8pt; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase;">
              ✓ CARDÁPIO VALIDADO
            </span>
            <span style="font-size: 8pt; opacity: 0.9;">Nutri Master | Nutri Félix</span>
          </div>
          <h1 style="margin-bottom: 2px;">PLANO ALIMENTAR PERSONALIZADO</h1>
          <div class="pdf-patient">Paciente: <strong>${nomePaciente}</strong></div>
        </div>

        <div>
          ${refeicoesHtml}
        </div>

        <div class="pdf-footer">
          <div style="display: flex; gap: 12px; align-items: center;">
            <div id="qrcode-pdf"></div>
            <div class="pdf-nutri-info">
              <div class="pdf-nutri-name">Christina Félix da Silva</div>
              <div>Nutricionista — CRN3-73810 Fito 0640</div>
              <div style="font-size: 7.5pt; color: #718096; margin-top: 2px;">
                Acesse nutrifelix.com.br ou escaneie o QR Code para validar este cardápio.<br>
                Ref. Cardápio: ${docId}
              </div>
            </div>
          </div>
        </div>
      `;

      setTimeout(() => {
        const qrContainer = document.getElementById('qrcode-pdf');
        if (qrContainer) {
          qrContainer.innerHTML = '';
          new QRCode(qrContainer, {
            text: urlValidacao,
            width: 65,
            height: 65,
            colorDark : "#1a5d57",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.M
          });
        }
      }, 100);
    }

    // 5. Download em PDF
    function baixarPDF() {
      const element = document.getElementById('pdf-content');
      const opt = {
        margin:       0,
        filename:     `Cardapio_${currentNomePaciente.replace(/\s+/g, '_')}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save();
    }
  </script>
</body>
</html>
