<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri Félix - Validar Cardápio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background-color: #f0f4f8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
    header { width: 100%; max-width: 900px; background: #fff8e7; border: 1px solid #707070; border-radius: 4px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .logo-img { width: 55px; height: 55px; object-fit: contain; }
    .menu-btn { background-color: #5551f1; color: white; border: none; width: 42px; height: 42px; border-radius: 8px; font-size: 20px; }
    .main-layout { display: flex; gap: 20px; max-width: 900px; width: 100%; }
    .card-left { background: white; border: 1px solid #c8c8c8; border-radius: 12px; width: 200px; padding: 12px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .card-img-wrapper { width: 100%; height: 220px; border: 1.5px solid #8183f0; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    .card-title { font-size: 14px; font-weight: 700; text-align: center; }
    .validation-box { flex: 1; background: white; border: 1px solid #b5b5b5; border-radius: 8px; padding: 24px; min-height: 280px; }
    .search-form { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-code { flex: 1; padding: 10px 14px; border: 1px solid #707070; border-radius: 4px; font-size: 14px; }
    .btn-submit { background-color: #5551f1; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .status-container { margin-top: 15px; font-size: 14px; }
    .result-card { border-radius: 6px; padding: 16px; margin-top: 10px; }
    .result-success { background-color: #e8f5e9; border: 1px solid #a5d6a7; color: #1b5e20; }
    .result-error { background-color: #ffebee; border: 1px solid #ef9a9a; color: #c62828; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <a href="index.html"><img src="nutriLogo.png" class="logo-img"></a>
    <button class="menu-btn">&#9776;</button>
  </header>

  <main class="main-layout">
    <div class="card-left">
      <div class="card-img-wrapper"><img src="1785022150778(1)(1).png" class="card-img"></div>
      <span class="card-title">Meu App</span>
    </div>

    <div class="validation-box">
      <form id="validateForm" class="search-form">
        <input type="text" id="codigoInput" class="input-code" placeholder="Digite aqui o código do seu cardápio" required>
        <button type="submit" class="btn-submit">Validar</button>
      </form>
      <div id="statusContainer" class="status-container"></div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQseJ1WXMOo-6HbSZ8euZGstspNABorA4",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "antares-7ebcb",
      storageBucket: "antares-7ebcb.firebasestorage.app",
      messagingSenderId: "663101896650",
      appId: "1:663101896650:web:7b23ff22cfd97a371b4133"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('validateForm');
    const input = document.getElementById('codigoInput');
    const statusContainer = document.getElementById('statusContainer');

    async function validarCardapio(codigo) {
      if (!codigo) return;
      statusContainer.innerHTML = '<p>Buscando cardápio no Firestore...</p>';

      try {
        const querySnapshot = await db.collection('CardapioIA')
                                      .where('Cardapio', '==', codigo.trim())
                                      .get();

        if (!querySnapshot.empty) {
          let html = '<div class="result-card result-success"><strong>Cardápio Encontrado!</strong>';
          querySnapshot.forEach(doc => {
            const data = doc.data();
            html += `<p style="margin-top:8px;">Código Válido: ${data.Cardapio}</p>`;
          });
          html += '</div>';
          statusContainer.innerHTML = html;
        } else {
          statusContainer.innerHTML = `<div class="result-card result-error">Cardápio código "${codigo}" não encontrado.</div>`;
        }
      } catch (err) {
        statusContainer.innerHTML = '<div class="result-card result-error">Erro ao consultar a base de dados.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const search = window.location.search;
      if (search) {
        const codigoParam = decodeURIComponent(search.substring(1).replace('codigo=', ''));
        if (codigoParam) {
          input.value = codigoParam;
          validarCardapio(codigoParam);
        }
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      validarCardapio(input.value);
    });
  </script>
</body>
</html>
