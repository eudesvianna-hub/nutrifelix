<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri Félix - Início</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        /* Seu estilo original dos cards e do topo */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 200px;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
        /* Estilo para a área onde o validar.html vai aparecer */
        #painel-validador {
            display: none;
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        #iframe-validador {
            width: 100%;
            height: 650px;
            border: none;
        }
    </style>
</head>
<body>

    <div style="background: #e8ded2; padding: 15px; text-align: center; border-bottom: 1px solid #d4c5b9;">
        <img src="nutriLogo.png" alt="Nutri Félix Logo" style="height: 50px;">
    </div>

    <div class="cards-container">
        <div class="card" onclick="abrirSecao('nutri-felix')">
            <img src="1785022150778(1)(1).png" alt="A Nutri Félix">
            <p>A Nutri Félix</p>
        </div>

        <div class="card" onclick="alternarValidador()">
            <img src="20260424_155202(1).jpg" alt="Meu App">
            <p>Meu App</p>
        </div>

        <div class="card" onclick="abrirSecao('van-nutri')">
            <img src="lv_0_20260127193932(1).jpg" alt="A Nutri Félix">
            <p>A Nutri Félix</p>
        </div>

        <div class="card" onclick="abrirSecao('para-voce')">
            <img src="nutricci.png" alt="Para você">
            <p>Para você</p>
        </div>
    </div>

    <div id="painel-validador">
        <iframe id="iframe-validador" src=""></iframe>
    </div>

    <script>
        function alternarValidador() {
            const painel = document.getElementById('painel-validador');
            const iframe = document.getElementById('iframe-validador');

            // Se o painel estiver oculto, ele abre e carrega o validar.html
            if (painel.style.display === 'none' || painel.style.display === '') {
                iframe.src = 'validar.html'; // Carrega o arquivo validar.html original do seu repositório
                painel.style.display = 'block';
                
                // Rola a tela suavemente para mostrar o painel embaixo dos cards
                painel.scrollIntoView({ behavior: 'smooth' });
            } else {
                // Se clicar de novo, ele oculta
                painel.style.display = 'none';
                iframe.src = ''; // Limpa o iframe
            }
        }

        function abrirSecao(secao) {
            // Caso queira programar os outros cards no futuro
            console.log('Clicou em: ' + secao);
        }
    </script>
</body>
</html>
