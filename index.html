<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri Félix - Início</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Container principal que centraliza o layout */
        .wrapper-principal {
            width: fit-content;
            margin: 20px auto;
            max-width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Retângulo superior marrom clarinho */
        .topo-container {
            background-color: #e8ded2;
            padding: 12px 20px;
            border: 1px solid #d4c5b9;
            width: 820px;
            max-width: 100%;
            box-sizing: border-box;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Mudado para alinhar tudo à esquerda */
            gap: 15px;
        }

        .topo-container img {
            height: 45px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Estilo para o novo texto no topo */
        .topo-frase {
            font-family: "Brush Script MT", "Caveat", "Segoe Script", cursive, sans-serif;
            font-size: 24px;
            color: #4a3b32;
            margin: 0;
            text-align: left; /* Mudado para alinhar à esquerda */
        }

        /* Container dos 4 cards */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 820px;
            max-width: 100%;
            margin-bottom: 25px;
        }

        /* Dimensões do card para computador */
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 180px;
            height: 300px;
            text-align: center;
            padding: 12px 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Imagens do card */
        .card img {
            width: 130px;
            height: 175px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 5px;
        }

        .card p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            padding-bottom: 5px;
        }

        /* PAINEL / IFRAME NA PARTE DE BAIXO */
        #painel-validador {
            display: block;
            width: 820px;
            max-width: 100%;
            margin: 0 auto 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #iframe-validador {
            width: 100%;
            min-height: 600px;
            border: none;
            overflow: hidden;
            display: block;
        }

        /* RESPONSIVIDADE PARA CELULARES (Telas até 768px) */
        @media (max-width: 768px) {
            .cards-container {
                gap: 8px; /* Reduz o espaço entre os cards para caberem 4 lado a lado */
            }

            .card {
                width: calc(25% - 8px); /* Deixa os 4 cards dividirem o espaço lado a lado */
                height: 190px;          /* Reduz a altura proporcionalmente */
                padding: 6px 4px;
            }

            .card img {
                width: 100%;
                height: 105px;          /* Ajusta a imagem para caber no card menor */
            }

            .card p {
                font-size: 10.5px;      /* Aumentado em cerca de 50% em relação ao original proporcional */
                font-weight: bold;
            }

            .topo-frase {
                font-size: 18px;        /* Ajuste proporcional da frase no celular */
            }
        }
    </style>
</head>
<body>

    <div class="wrapper-principal">
        <div class="topo-container">
            <img src="nutriLogo.png" alt="Nutri Félix Logo" onclick="carregarPaginaIframe('inicio.html')" title="Ir para a página inicial">
            <p class="topo-frase">Seja você sua maior inspiração</p>
        </div>

        <div class="cards-container">
            <div class="card" onclick="carregarPaginaIframe('nutri.html')">
                <img src="20260424_155202(1).jpg" alt="A Nutri Félix">
                <p>A Nutri Félix</p>
            </div>

            <div class="card" onclick="carregarPaginaIframe('validar.html')">
                <img src="1785022150778(1)(1).png" alt="Meu App">
                <p>Meu App</p>
            </div>

            <div class="card" onclick="carregarPaginaIframe('van-nutri.html')">
                <img src="lv_0_20260127193932(1).jpg" alt="O Babus">
                <p>O Babus</p>
            </div>

            <div class="card" onclick="carregarPaginaIframe('nutricci.png')">
                <img src="nutricci.png" alt="Para você">
                <p>Para você</p>
            </div>
        </div>

        <div id="painel-validador">
            <iframe id="iframe-validador" scrolling="no" src="inicio.html"></iframe>
        </div>
    </div>

    <script>
        function carregarPaginaIframe(pagina) {
            const iframe = document.getElementById('iframe-validador');
            iframe.src = pagina;
        }

        document.getElementById('iframe-validador').addEventListener('load', function() {
            try {
                const iframeDoc = this.contentDocument || this.contentWindow.document;
                if (iframeDoc) {
                    const alturaConteudo = iframeDoc.documentElement.scrollHeight || iframeDoc.body.scrollHeight;
                    if (alturaConteudo > 600) {
                        this.style.height = alturaConteudo + 'px';
                    } else {
                        this.style.height = '600px';
                    }
                }
            } catch (e) {
                console.log('Ajuste de altura automático via iframe (Cross-origin restrito localmente).');
                this.style.height = '600px';
            }
        });
    </script>
</body>
</html>
