<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri Félix - Início</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Container principal com controle centralizado de largura */
        .wrapper-principal {
            width: 100%;
            max-width: 820px;
            margin: 20px auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Retângulo superior */
        .topo-container {
            background-color: #e8ded2;
            padding: 12px 20px;
            border: 1px solid #d4c5b9;
            width: 100%;
            box-sizing: border-box;
            border-radius: 12px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
        }

        .topo-container img {
            height: 45px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .topo-frase {
            font-family: "Brush Script MT", "Caveat", "Segoe Script", cursive, sans-serif;
            font-size: 24px;
            color: #4a3b32;
            margin: 0;
            text-align: left;
        }

        /* Container dos 4 cards */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
            margin-bottom: 25px;
        }

        /* Dimensões do card adaptadas para elemento button */
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 180px;
            height: 300px;
            text-align: center;
            padding: 12px 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card:hover, .card:focus {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            outline: none;
        }

        .card img {
            width: 130px;
            height: 175px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 5px;
        }

        .card p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            padding-bottom: 5px;
        }

        /* PAINEL / IFRAME */
        #painel-validador {
            display: block;
            width: 100%;
            margin: 0 auto 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #iframe-validador {
            width: 100%;
            min-height: 600px;
            border: none;
            overflow: hidden;
            display: block;
        }

        /* RESPONSIVIDADE PARA CELULARES */
        @media (max-width: 768px) {
            .cards-container {
                gap: 8px;
            }

            .card {
                width: calc(25% - 6px);
                height: 190px;
                padding: 6px 4px;
            }

            .card img {
                width: 100%;
                height: 105px;
            }

            .card p {
                font-size: 10.5px;
            }

            .topo-frase {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <main class="wrapper-principal">
        <header class="topo-container">
            <img src="nutriLogo.png" alt="Nutri Félix Logo" onclick="carregarPaginaIframe('nutri.html')" title="Ir para a página inicial">
            <p class="topo-frase">Seja você sua maior inspiração</p>
        </header>

        <nav class="cards-container" aria-label="Navegação principal">
            <button class="card" onclick="carregarPaginaIframe('nutri.html')">
                <img src="20260424_155202(1).jpg" alt="A Nutri Félix">
                <p>A Nutri Félix</p>
            </button>

            <button class="card" onclick="carregarPaginaIframe('validar.html')">
                <img src="1785022150778(1)(1).png" alt="Meu App">
                <p>Meu App</p>
            </button>

            <button class="card" onclick="carregarPaginaIframe('babus.html')">
                <img src="lv_0_20260127193932(1).jpg" alt="O Babus">
                <p>O Babus</p>
            </button>

            <button class="card" onclick="carregarPaginaIframe('voce.html')">
                <img src="nutricci.png" alt="Para você">
                <p>Para você</p>
            </button>
        </nav>

        <section id="painel-validador">
            <iframe id="iframe-validador" title="Conteúdo selecionado" scrolling="no" src="nutri.html"></iframe>
        </section>
    </main>

    <script>
        function carregarPaginaIframe(pagina) {
            const iframe = document.getElementById('iframe-validador');
            iframe.src = pagina;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const search = window.location.search;
            if (search) {
                const urlParams = new URLSearchParams(search);
                let codigoParam = urlParams.get('id') || urlParams.get('codigo');

                if (!codigoParam && search.length > 1) {
                    codigoParam = decodeURIComponent(search.substring(1));
                }

                if (codigoParam) {
                    const iframe = document.getElementById('iframe-validador');
                    iframe.src = `validar.html?id=${encodeURIComponent(codigoParam.trim())}`;
                }
            }
        });

        document.getElementById('iframe-validador').addEventListener('load', function() {
            try {
                const iframeDoc = this.contentDocument || this.contentWindow.document;
                if (iframeDoc) {
                    const alturaConteudo = iframeDoc.documentElement.scrollHeight || iframeDoc.body.scrollHeight;
                    this.style.height = (alturaConteudo > 600 ? alturaConteudo : 600) + 'px';
                }
            } catch (e) {
                console.log('Ajuste de altura automático via iframe (Cross-origin restrito localmente).');
                this.style.height = '600px';
            }
        });
    </script>
</body>
</html>
