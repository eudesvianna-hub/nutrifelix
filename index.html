<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri Félix - Início</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Container principal que centraliza o layout */
        .wrapper-principal {
            width: fit-content;
            margin: 20px auto;
        }

        /* Retângulo superior marrom clarinho com cantos arredondados e largura exata dos cards */
        .topo-container {
            background-color: #e8ded2;
            padding: 12px 20px;
            text-align: left;
            border: 1px solid #d4c5b9;
            width: 820px; /* Largura exata correspondente aos 4 cards */
            max-width: 95vw;
            box-sizing: border-box;
            border-radius: 12px; /* Cantos arredondados conforme referência */
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .topo-container img {
            height: 45px;
            cursor: pointer; /* Clicar na logo volta para a página inicial */
        }

        /* Container dos 4 cards */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 820px; /* Mesma largura exata do topo */
            max-width: 95vw;
            margin-bottom: 25px;
        }

        /* Dimensões do card */
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            width: 180px;
            height: 300px;
            text-align: center;
            padding: 12px 8px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Imagens na vertical (retrato) */
        .card img {
            width: 130px;
            height: 175px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 5px;
        }

        /* Espaçamento elegante entre a imagem e o nome */
        .card p {
            margin: 0;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            padding-bottom: 5px;
        }

        /* PAINEL / IFRAME NA PARTE DE BAIXO (SEMPRE VISÍVEL) */
        #painel-validador {
            display: block; /* Sempre visível desde o início */
            width: 820px; /* Mesma largura exata dos cards e do topo */
            max-width: 95vw;
            margin: 0 auto 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #iframe-validador {
            width: 100%;
            min-height: 600px; /* Altura mínima generosa (quase quadrada/espaçosa) para evitar cortes */
            border: none;
            overflow: hidden;
            display: block;
        }
    </style>
</head>
<body>

    <div class="wrapper-principal">
        <div class="topo-container">
            <img src="nutriLogo.png" alt="Nutri Félix Logo" onclick="carregarPaginaIframe('inicio.html')" title="Ir para a página inicial">
        </div>

        <div class="cards-container">
            <div class="card" onclick="carregarPaginaIframe('nutri.html')">
                <img src="20260424_155202(1).jpg" alt="A Nutri Félix">
                <p>A Nutri Félix</p>
            </div>

            <div class="card" onclick="carregarPaginaIframe('validar.html')">
                <img src="1785022150778(1)(1).png" alt="Meu App">
                <p>Meu App</p>
            </div>

            <div class="card" onclick="carregarPaginaIframe('van-nutri.html')">
                <img src="lv_0_20260127193932(1).jpg" alt="O Babus">
                <p>O Babus</p>
            </div>

            <div class="card" onclick="carregarPaginaIframe('nutricci.png')">
                <img src="nutricci.png" alt="Para você">
                <p>Para você</p>
            </div>
        </div>

        <div id="painel-validador">
            <iframe id="iframe-validador" scrolling="no" src="inicio.html"></iframe>
        </div>
    </div>

    <script>
        // Carrega a página desejada dentro do iframe mantendo a altura dinâmica
        function carregarPaginaIframe(pagina) {
            const iframe = document.getElementById('iframe-validador');
            iframe.src = pagina;
        }

        // Ajusta automaticamente a altura do iframe caso a página interna seja maior que a altura mínima
        document.getElementById('iframe-validador').addEventListener('load', function() {
            try {
                const iframeDoc = this.contentDocument || this.contentWindow.document;
                if (iframeDoc) {
                    const alturaConteudo = iframeDoc.documentElement.scrollHeight || iframeDoc.body.scrollHeight;
                    // Garante que respeite o tamanho mínimo de 600px, mas cresça se precisar
                    if (alturaConteudo > 600) {
                        this.style.height = alturaConteudo + 'px';
                    } else {
                        this.style.height = '600px';
                    }
                }
            } catch (e) {
                console.log('Ajuste de altura automático via iframe (Cross-origin restrito localmente).');
                this.style.height = '600px';
            }
        });
    </script>
</body>
</html>
