<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutri Félix - Início</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }

        /* Retângulo superior marrom clarinho alinhado à esquerda */
        .topo-container {
            background-color: #e8ded2;
            padding: 10px 20px;
            text-align: left;
            border-bottom: 1px solid #d4c5b9;
            width: fit-content; /* Faz o retângulo ocupar apenas o espaço necessário */
            min-width: 250px;
            border-radius: 0 4px 4px 0;
            margin-bottom: 20px;
        }

        .topo-container img {
            height: 45px;
            cursor: pointer; /* Indica que é clicável para voltar ao início */
        }

        /* Container dos 4 cards centralizado */
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 10px 20px;
            flex-wrap: wrap;
        }

        /* Medidas exatas do card: 180 de largura por 300 de altura */
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 180px;
            height: 300px;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Imagens dentro dos cards: 150 de altura por 200 de largura */
        .card img {
            width: 200px;
            height: 150px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .card p {
            margin: 10px 0 0 0;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* PAINEL / IFRAME ABAIXO DOS CARDS */
        #painel-validador {
            display: none; /* Oculto inicialmente */
            width: 820px; /* Largura proporcional e alinhada aos 4 cards juntos */
            max-width: 95%;
            margin: 30px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 1px solid #ccc;
        }

        #iframe-validador {
            width: 100%;
            height: 550px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="topo-container">
        <img src="nutriLogo.png" alt="Nutri Félix Logo" onclick="voltarInicio()" title="Ir para a página inicial">
    </div>

    <div class="cards-container">
        <div class="card" onclick="abrirSecao('nutri-felix')">
            <img src="1785022150778(1)(1).png" alt="A Nutri Félix">
            <p>A Nutri Félix</p>
        </div>

        <div class="card" onclick="carregarValidador()">
            <img src="20260424_155202(1).jpg" alt="Meu App">
            <p>Meu App</p>
        </div>

        <div class="card" onclick="abrirSecao('van-nutri')">
            <img src="lv_0_20260127193932(1).jpg" alt="A Nutri Félix">
            <p>A Nutri Félix</p>
        </div>

        <div class="card" onclick="abrirSecao('para-voce')">
            <img src="nutricci.png" alt="Para você">
            <p>Para você</p>
        </div>
    </div>

    <div id="painel-validador">
        <iframe id="iframe-validador" src=""></iframe>
    </div>

    <script>
        // Função chamada ao clicar no segundo card ("Meu App")
        function carregarValidador() {
            const painel = document.getElementById('painel-validador');
            const iframe = document.getElementById('iframe-validador');

            // Carrega o validar.html dentro do iframe alinhado
            iframe.src = 'validar.html';
            painel.style.display = 'block';
            
            // Rola suavemente para o painel sem cobrir tudo de forma exagerada
            painel.scrollIntoView({ behavior: 'smooth' });
        }

        // Função chamada ao clicar na logo da Nutri Félix (Botão Home)
        function voltarInicio() {
            const painel = document.getElementById('painel-validador');
            const iframe = document.getElementById('iframe-validador');

            // Fecha/limpa o iframe e oculta o painel
            iframe.src = '';
            painel.style.display = 'none';

            // Retorna o scroll para o topo da página
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function abrirSecao(secao) {
            console.log('Seção clicada: ' + secao);
        }
    </script>
</body>
</html>
